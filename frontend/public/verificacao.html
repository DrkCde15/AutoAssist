﻿<!doctype html>
<html lang="pt-BR" class="" data-scroll-behavior="smooth">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0c0c14" />
    <title>Verificação de segurança | AutoAssist</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.ico" sizes="256x256" type="image/x-icon" />
    <link rel="icon" href="/logo2.png" />
    <link rel="stylesheet" href="/css/styles.css" />
    <script src="/js/api.js" defer></script>
    <script src="/js/auth.js" defer></script>
    <script src="/js/nav.js" defer></script>
    <script src="/js/components.js" defer></script>
  </head>
  <body class="font-sans antialiased">
    <main
      class="flex min-h-screen items-center justify-center bg-primary px-4 py-12"
    >
      <div class="w-full max-w-md">
        <div class="mb-8 text-center">
          <a class="inline-flex items-center gap-2 text-primary" href="/"
            ><img src="/logo.png" alt="AutoAssist" class="h-14 w-auto"
          /></a>
        </div>
        <div
          class="rounded-2xl border border-border bg-secondary p-8 text-center"
        >
          <div
            class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-2xl bg-accent/10"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-shield-check h-8 w-8 text-accent"
              aria-hidden="true"
            >
              <path
                d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"
              ></path>
              <path d="m9 12 2 2 4-4"></path>
            </svg>
          </div>
          <h1 class="mb-2 font-display text-2xl font-bold text-primary">
            Verificação de segurança
          </h1>
          <p class="mb-6 text-sm text-secondary">
            Para acessar o chat, precisamos confirmar que você não é um robô.
          </p>
          <button
            id="verifyBtn"
            class="flex w-full items-center justify-center gap-2 rounded-lg bg-accent px-4 py-3 text-sm font-medium text-white transition-colors hover:bg-accent/90 disabled:cursor-not-allowed disabled:opacity-50"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-shield-check h-4 w-4"
              aria-hidden="true"
            >
              <path
                d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"
              ></path>
              <path d="m9 12 2 2 4-4"></path></svg
            >Verificar agora
          </button>
          <div id="turnstileBox" class="mt-4 min-h-[65px]"></div>
          <div
            id="error"
            class="hidden mt-4 rounded-lg bg-red-500/10 p-3 text-sm text-red-400"
          ></div>
        </div>
        <div class="mt-6 text-center text-sm">
          <a class="text-accent hover:text-accent/80" href="/login"
            >Voltar para login</a
          >
        </div>
      </div>
    </main>
    <script
      src="https://challenges.cloudflare.com/turnstile/v0/api.js"
      async
      defer
    ></script>
    <script>
      (function () {
        var verifyBtn = document.getElementById("verifyBtn");
        var errorDiv = document.getElementById("error");
        var turnstileToken = null;
        var turnstileWidgetId = null;

        var params = new URLSearchParams(window.location.search);
        var token = params.get("token");
        if (!token) {
          errorDiv.textContent =
            "Token de verificação não encontrado. Acesse pelo chat.";
          errorDiv.classList.remove("hidden");
          verifyBtn.disabled = true;
          return;
        }

        fetch("/api/config/public")
          .then(function (r) {
            return r.json();
          })
          .then(function (d) {
            var key = d.turnstile_site_key;
            if (key && typeof turnstile !== "undefined") {
              turnstileWidgetId = turnstile.render("#turnstileBox", {
                sitekey: key,
                action: "verify",
                theme: "dark",
                callback: function (t) {
                  turnstileToken = t;
                  verifyBtn.disabled = false;
                },
                "expired-callback": function () {
                  turnstileToken = null;
                  verifyBtn.disabled = true;
                },
                "error-callback": function () {
                  turnstileToken = null;
                  verifyBtn.disabled = true;
                },
              });
            } else {
              verifyBtn.disabled = false;
            }
          })
          .catch(function () {
            verifyBtn.disabled = false;
          });

        verifyBtn.addEventListener("click", function () {
          verifyBtn.disabled = true;
          verifyBtn.textContent = "Verificando...";
          window.api
            .post("/api/auth/verify", {
              turnstile_token: turnstileToken || token,
            })
            .then(function (res) {
              if (res.access_token) {
                localStorage.setItem(
                  "autoassist_access_token",
                  res.access_token,
                );
              }
              if (res.user) {
                localStorage.setItem(
                  "autoassist_user",
                  JSON.stringify(res.user),
                );
              }
              window.location.href = "/chat";
            })
            .catch(function (err) {
              errorDiv.textContent =
                err.message || "Erro na verificação. Tente novamente.";
              errorDiv.classList.remove("hidden");
              verifyBtn.disabled = false;
              verifyBtn.textContent = "Verificar agora";
              if (
                typeof turnstile !== "undefined" &&
                turnstileWidgetId !== null
              ) {
                turnstileToken = null;
                turnstile.reset(turnstileWidgetId);
              }
            });
        });
      })();
    </script>
  </body>
</html>
