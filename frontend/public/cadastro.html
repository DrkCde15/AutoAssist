<!doctype html>
<html lang="pt-BR" class="" data-scroll-behavior="smooth">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0c0c14" />
    <title>Criar conta | AutoAssist</title>
    <meta name="description" content="Crie sua conta AutoAssist." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/logo2.png" />
    <link rel="stylesheet" href="/css/styles.css" />
    <script
      src="https://challenges.cloudflare.com/turnstile/v0/api.js"
      async
      defer
    ></script>
    <script src="/js/api.js" defer></script>
    <script src="/js/auth.js" defer></script>
    <script src="/js/cadastro.js" defer></script>
  </head>
  <body class="font-sans antialiased bg-primary">
    <main class="flex min-h-screen items-center justify-center px-4 py-12">
      <div class="w-full max-w-md">
        <div class="mb-8 text-center">
          <a class="inline-flex items-center gap-2 text-primary" href="/">
            <img src="/logo.png" alt="AutoAssist" class="h-14 w-auto" />
          </a>
        </div>
        <div class="rounded-2xl border border-border bg-secondary p-6 sm:p-8">
          <h1
            class="mb-2 text-center font-display text-2xl font-bold text-primary"
          >
            Criar sua conta
          </h1>
          <p class="mb-6 text-center text-sm text-muted">
            Comece a cuidar do seu veículo com a AutoAssist
          </p>

          <a
            href="/api/auth/google/login"
            class="mb-4 flex w-full items-center justify-center gap-3 rounded-lg border border-border bg-secondary px-4 py-3 text-sm font-medium text-primary transition-colors hover:bg-border/50"
          >
            <svg class="h-5 w-5" viewBox="0 0 24 24">
              <path
                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"
                fill="#4285F4"
              ></path>
              <path
                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                fill="#34A853"
              ></path>
              <path
                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                fill="#FBBC05"
              ></path>
              <path
                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                fill="#EA4335"
              ></path>
            </svg>
            Cadastrar com Google
          </a>

          <div class="relative my-6">
            <div class="absolute inset-0 flex items-center">
              <div class="w-full border-t border-border"></div>
            </div>
            <div class="relative flex justify-center text-sm">
              <span class="bg-secondary px-3 text-muted">ou com e-mail</span>
            </div>
          </div>

          <form id="signupForm" class="space-y-4">
            <div id="referral-banner" class="hidden rounded-lg border border-accent/30 bg-accent/10 px-4 py-3 text-sm text-primary">
              Você foi convidado! Complete o cadastro e quem indicou ganha <strong>1 mês de Premium</strong>.
            </div>
            <div>
              <label class="mb-1.5 block text-sm font-medium text-secondary"
                >Nome Completo</label
              >
              <input
                id="name"
                type="text"
                placeholder="Joo da Silva"
                required
                class="w-full rounded-lg border border-border bg-primary px-4 py-3 text-primary placeholder:text-muted focus:border-accent focus:outline-none focus:ring-1 focus:ring-accent"
              />
            </div>
            <div>
              <label class="mb-1.5 block text-sm font-medium text-secondary"
                >E-mail</label
              >
              <input
                id="email"
                type="email"
                placeholder="seu@email.com"
                required
                class="w-full rounded-lg border border-border bg-primary px-4 py-3 text-primary placeholder:text-muted focus:border-accent focus:outline-none focus:ring-1 focus:ring-accent"
              />
            </div>
            <div>
              <label class="mb-1.5 block text-sm font-medium text-secondary"
                >Confirmar E-mail</label
              >
              <input
                id="confirm-email"
                type="email"
                placeholder="seu@email.com"
                required
                class="w-full rounded-lg border border-border bg-primary px-4 py-3 text-primary placeholder:text-muted focus:border-accent focus:outline-none focus:ring-1 focus:ring-accent"
              />
            </div>
            <div>
              <label class="mb-1.5 block text-sm font-medium text-secondary"
                >Senha</label
              >
              <input
                id="password"
                type="password"
                placeholder="Mnimo 8 caracteres"
                required
                minlength="8"
                class="w-full rounded-lg border border-border bg-primary px-4 py-3 text-primary placeholder:text-muted focus:border-accent focus:outline-none focus:ring-1 focus:ring-accent"
              />
            </div>
            <div>
              <label class="mb-1.5 block text-sm font-medium text-secondary"
                >Confirmar Senha</label
              >
              <input
                id="password2"
                type="password"
                placeholder="••••••••"
                required
                minlength="8"
                class="w-full rounded-lg border border-border bg-primary px-4 py-3 text-primary placeholder:text-muted focus:border-accent focus:outline-none focus:ring-1 focus:ring-accent"
              />
            </div>
            <div id="turnstileBox" class="min-h-[65px]"></div>
            <div
              id="error"
              class="hidden rounded-lg bg-red-500/10 p-3 text-sm text-red-400"
            ></div>
            <button
              id="submitBtn"
              type="submit"
              disabled
              class="flex w-full items-center justify-center gap-2 rounded-lg bg-accent px-4 py-3 text-sm font-medium text-white transition-colors hover:bg-accent/90 disabled:cursor-not-allowed disabled:opacity-50"
            >
              Criar conta
            </button>
          </form>

          <div class="mt-6 text-center text-sm">
            <span class="text-muted">J tem conta? </span>
            <a class="text-accent hover:text-accent/80" href="/login">Entrar</a>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
